name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python scripts/validate_skill.py .
      - name: generated atlas layout is up to date (PNG pixels may vary slightly between Pillow versions)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python scripts/generate_procedural_character.py --out /tmp/hero --validate
          cmp /tmp/hero/hero.json assets/examples/hero/hero.json

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/py -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-results, path: test-results }
