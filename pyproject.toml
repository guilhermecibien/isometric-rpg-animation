[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isoanim"
version = "0.1.0"
description = "Sprite pipeline, validators and procedural demo generator for the isometric-rpg-animation skill"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
isoanim = "isoanim.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
pythonpath = ["python"]
